// The optional `subtitle` argument lets you override the placeholder text
// for a specific item/condition if needed; otherwise it's auto-generated.
function build_trial(item_name, condition, subtitle) {
  return {
    item_name: item_name,
    condition: condition,
    fixation_image: `img/${item_name}_${condition}.jpg`,
    video: `videos/${item_name}_${condition}.mp4`,
    subtitle: subtitle,
    mcq_prompt: '<p>Attention check:<br><br> Which object was the question about?</p>',

      `img/${item_name}_clearly_false.jpg`,
      `img/${item_name}_debatable.jpg`,
      `img/${item_name}_unused.jpg`
    ]
  };
}

// =========================================================
// PRACTICE TRIALS (same for every list)
// Same format as the main lists: [item_name, condition, subtitle].
// They go through the same build_trial() helper, so they follow the same
// file naming convention as your real stimuli, e.g. for the first entry:
//   img/practice1_clearly_pos_left.jpg, videos/practice1_clearly_pos_left.mp4,
//   img/practice1_clearly_true.jpg, ..._clearly_false.jpg, ..._debatable.jpg, ..._unused.jpg
// EDIT these to match your actual practice stimuli.
// =========================================================
const practice_list = [
  ["practice_yes", "practice",  "Is the brush on a basket?"],
  ["practice_no", "practice", "Is the stapler next to a scissor?"]
];

// =========================================================
// TRIAL SEQUENCE BUILDER
// Turns ONE stimulus object into the full per-item trial sequence
// (fixation -> autoplay video -> video + yes/no -> attention check -> continue).
// It is used for BOTH the practice trials and the real trials, so they are
// guaranteed to look identical, and any change to the trial design only has
// to be made in this one place.
// `is_practice` is saved in every trial's data (practice: true/false) so
// practice rows are easy to filter out at analysis time.
// =========================================================
function make_trial_sequence(s, is_practice) {
  const base_data = { item_name: s.item_name, condition: s.condition, practice: is_practice };

  // Images are shuffled per-participant, and the resulting order is stored
  // in trial data so you can map the clicked button index back to the image.
  const shuffled_images = jsPsych.randomization.shuffle(s.mcq_images);

  return [
    // Stage 1: fixation image for 2 seconds, no response needed
    {
      type: jsPsychImageKeyboardResponse,
      stimulus: s.fixation_image,
      stimulus_width: 640,
      choices: "NO_KEYS",
      trial_duration: 2000,
      response_ends_trial: false,
      data: { ...base_data, trial_stage: 'fixation' }
    },

    // Stage 2: video autoplays once, no controls, progresses automatically at the end
    {
      type: jsPsychVideoKeyboardResponse,
      stimulus: [s.video],
      width: 640,
      choices: "NO_KEYS",
      //prompt: `<p style="font-size:18px;">${s.subtitle}</p>`,
      autoplay: true,
      controls: false,
      response_allowed_while_playing: false,
      trial_ends_after_video: true,
      data: { ...base_data, trial_stage: 'video_autoprogress' }
    },

    // Stage 3: video with controls, subtitle always visible as the prompt,
    // Yes/No buttons progress the trial directly (built-in video-button-response)
    {
      type: jsPsychVideoButtonResponse,
      stimulus: [s.video],
      width: 640,
      //height: 400, // 360 (true 16:9 height at 640 wide) + ~40px buffer for controls
      choices: ['Yes', 'No'],
      prompt: `<p style="font-size:18px;">${s.subtitle}</p>`,
      autoplay: false,
      controls: true,
      response_allowed_while_playing: true,
      trial_ends_after_video: false,          // trial waits for a button click, not just video end
      data: { ...base_data, trial_stage: 'video_yesno' },
      // The plugin always renders: video -> buttons -> prompt (in that DOM order).
      // This moves the prompt element to appear right before the button group instead,
      // so the subtitle shows above the Yes/No buttons rather than below them.
      on_load: function () {
        const displayElement = jsPsych.getDisplayElement();
        const btnGroup = displayElement.querySelector('[id$="btngroup"]');
        const promptEl = displayElement.lastElementChild;
        if (btnGroup && promptEl && promptEl !== btnGroup) {
          displayElement.insertBefore(promptEl, btnGroup);
        }
      }
    },

    // Stage 4: multiple-choice image question (built-in html-button-response,
    // with each button's HTML content being an <img> instead of plain text).
    {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p style="font-size:20px;">${s.mcq_prompt}</p>`,
      choices: shuffled_images.map(img => `<img src="${img}" style="width:200px; padding:10px;"/>`),
      button_layout: 'grid',
      grid_rows: 2,
      grid_columns: 2,
      data: {
        ...base_data,
        trial_stage: 'mcq',
        image_order: shuffled_images // order the images were actually shown in for this trial
      },
      on_finish: function (data) {
        // convenience field: which image file was actually clicked
        data.selected_image = data.image_order[data.response];
      }
    },

    // Stage 5: Continue button to next trial
    {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p>When you're ready, click on this button to continue. <br></p>`,
      choices: ['Continue']
    }
  ];
}

// ---- Randomly assign this participant to one of the 8 lists ----
const list_number = Math.floor(Math.random() * lists.length); // 0-7
 
// ---- Build the actual stimulus objects for the chosen list ----
const stimuli = lists[list_number].map(entry => build_trial(entry[0], entry[1], entry[2]));
 
// ---- Record list assignment in the data for later analysis ----
jsPsych.data.addProperties({ list_number: list_number });

// ---- Build the practice stimulus objects ----
const practice_stimuli = practice_list.map(entry => build_trial(entry[0], entry[1], entry[2]));

// ---- Preload all media files (practice + real) ----
const all_images = [];
const all_videos = [];
[...practice_stimuli, ...stimuli].forEach(s => {
  all_images.push(s.fixation_image, ...s.mcq_images);
  all_videos.push(s.video);
});

const preload = {
  type: jsPsychPreload,
  images: all_images,
  video: all_videos
};

// ---- Build the timeline ----
// Practice trials sit between the audio check and the "ready" screen.
const timeline = [
  preload,
  consent_trial,
  instructions_trial,
  audio_check_trial,
  ...practice_stimuli.flatMap(s => make_trial_sequence(s, true)),
  ready_trial,
  ...stimuli.flatMap(s => make_trial_sequence(s, false))
];

    </p>
